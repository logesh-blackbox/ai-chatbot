<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Promo Modal — Demo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <nav>
      <ul>
        <li>Pricing</li>
        <li>Product</li>
        <li>Agent</li>
        <li>CLI</li>
      </ul>
    </nav>
    <div class="brand">BLACKBOX AI</div>
  </header>

  <main class="page">
    <div class="dim"></div>

    <div class="modal" role="dialog" aria-labelledby="promo-title">
      <div class="modal-hero">
        <div class="promo-pill">You Get 50% Discount</div>
      </div>

      <div class="modal-body">
        <h2 id="promo-title">Claim Your 50% Discount Now!</h2>
        <p class="muted">Limited time offer — Get 50% off on all premium plans. Upgrade now and unlock advanced AI features at half the price.</p>
        <button class="cta">Continue</button>
      </div>
    </div>
  </main>
</body>
</html>
