<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackbox AI - 50% Discount Offer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background-color: #0a0a0a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal {
            background-color: #1a1a1a;
            border-radius: 16px;
            overflow: hidden;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-header {
            position: relative;
            padding: 60px 40px;
            background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
            text-align: center;
            overflow: hidden;
        }

        .modal-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                repeating-linear-gradient(0deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 1px, transparent 1px, transparent 2px),
                repeating-linear-gradient(90deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 1px, transparent 1px, transparent 2px);
            background-size: 20px 20px;
            opacity: 0.5;
        }

        .discount-badge {
            position: relative;
            display: inline-block;
            background-color: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 16px 48px;
            border-radius: 50px;
            font-size: 24px;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        .modal-content {
            padding: 40px;
            text-align: center;
        }

        .modal-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 16px;
            color: #ffffff;
            line-height: 1.3;
        }

        .modal-description {
            font-size: 15px;
            line-height: 1.6;
            color: #a0a0a0;
            margin-bottom: 32px;
        }

        .continue-button {
            width: 100%;
            padding: 16px 32px;
            background-color: #ffffff;
            color: #000000;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .continue-button:hover {
            background-color: #f0f0f0;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.2);
        }

        .continue-button:active {
            transform: translateY(0);
        }

        /* Background content simulation */
        .background-content {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 40px;
            opacity: 0.3;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #666 0%, #444 100%);
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        }

        .logo-text {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        @media (max-width: 600px) {
            .modal {
                margin: 20px;
            }

            .modal-header {
                padding: 40px 24px;
            }

            .discount-badge {
                font-size: 20px;
                padding: 14px 36px;
            }

            .modal-content {
                padding: 32px 24px;
            }

            .modal-title {
                font-size: 24px;
            }

            .modal-description {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <!-- Background Content -->
    <div class="background-content">
        <div class="logo">
            <div class="logo-icon"></div>
            <div class="logo-text">BLACKBOX AI</div>
        </div>
    </div>

    <!-- Modal Overlay -->
    <div class="overlay">
        <div class="modal">
            <div class="modal-header">
                <div class="discount-badge">You Get 50% Discount</div>
            </div>
            <div class="modal-content">
                <h2 class="modal-title">Claim Your 50% Discount Now!</h2>
                <p class="modal-description">
                    Limited time offer - Get 50% off on all premium plans. Upgrade now and unlock advanced AI features at half the price.
                </p>
                <button class="continue-button" onclick="handleContinue()">Continue</button>
            </div>
        </div>
    </div>

    <script>
        function handleContinue() {
            alert('Redirecting to checkout...');
            // Add your redirect logic here
            // window.location.href = '/checkout';
        }

        // Close modal on ESC key
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                console.log('Modal closed');
                // Add close logic here
            }
        });
    </script>
</body>
</html>
